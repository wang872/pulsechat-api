<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PulseChat Demo</title>
  <style>
    :root { color-scheme: dark; --bg:#0f1419; --card:#1a2330; --line:#2b3a4d; --acc:#3d9cf0; --text:#e8eef5; --muted:#8aa0b8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); }
    header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
    h1 { font-size:18px; margin:0; }
    main { display:grid; grid-template-columns: 260px 1fr; height:calc(100vh - 57px); }
    aside, section { padding:16px; }
    aside { border-right:1px solid var(--line); overflow:auto; }
    .row { display:flex; gap:8px; margin:8px 0; }
    input, button { border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); padding:8px 10px; }
    button { background:var(--acc); border-color:transparent; cursor:pointer; color:#fff; font-weight:600; }
    .room { padding:10px; border-radius:8px; cursor:pointer; margin-bottom:6px; background:var(--card); }
    .room.active { outline:1px solid var(--acc); }
    .unread { background:#d97706; color:#fff; border-radius:999px; padding:0 6px; font-size:12px; margin-left:6px; }
    #log { height:calc(100vh - 220px); overflow:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
    .msg { margin:0 0 8px; }
    .meta { color:var(--muted); font-size:12px; }
    .hint { color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <header>
    <h1>PulseChat</h1>
    <div class="hint">开两个浏览器窗口，分别登录 alice / bob，密码 123456</div>
  </header>
  <main>
    <aside>
      <div class="row">
        <input id="user" placeholder="username" value="alice" />
        <input id="pass" placeholder="password" type="password" value="123456" />
      </div>
      <div class="row">
        <button onclick="login()">登录并连接</button>
      </div>
      <div class="row">
        <input id="group" placeholder="新群名" />
        <button onclick="createGroup()">建群</button>
      </div>
      <div class="row">
        <input id="peer" placeholder="私聊用户名" value="bob" />
        <button onclick="openDirect()">私聊</button>
      </div>
      <div id="rooms"></div>
    </aside>
    <section>
      <div id="title">未选择房间</div>
      <div id="log"></div>
      <div class="row">
        <input id="text" style="flex:1" placeholder="输入消息，Enter 发送" onkeydown="if(event.key==='Enter') send()" />
        <button onclick="send()">发送</button>
      </div>
    </section>
  </main>
  <script>
    let token = null, socket = null, currentRoom = null, me = null;

    async function api(path, opts = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      if (token) headers.Authorization = "Bearer " + token;
      const res = await fetch(path, Object.assign({}, opts, { headers }));
      if (!res.ok) throw new Error(await res.text());
      return res.status === 204 ? null : res.json();
    }

    function log(line, meta) {
      const el = document.createElement("div");
      el.className = "msg";
      el.innerHTML = (meta ? `<div class="meta">${meta}</div>` : "") + `<div>${line}</div>`;
      document.getElementById("log").appendChild(el);
      document.getElementById("log").scrollTop = 99999;
    }

    async function login() {
      const body = JSON.stringify({ username: user.value, password: pass.value });
      const data = await api("/auth/login", { method: "POST", body });
      token = data.access_token;
      me = await api("/auth/me");
      connectWs();
      await refreshRooms();
      log("已登录 " + me.username);
    }

    function connectWs() {
      if (socket) socket.close();
      const proto = location.protocol === "https:" ? "wss" : "ws";
      socket = new WebSocket(`${proto}://${location.host}/ws?token=${token}`);
      socket.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "joined") log("已加入房间 " + msg.room_id);
        else if (msg.type === "message") log(msg.content, msg.sender_username);
        else if (msg.type === "typing") log(msg.username + " 正在输入...", "typing");
        else if (msg.type === "presence") log((msg.username || msg.user_id) + (msg.online ? " 上线" : " 离线"), "presence");
        else if (msg.type === "error") log(msg.detail, "error");
      };
    }

    async function refreshRooms() {
      const rooms = await api("/rooms");
      document.getElementById("rooms").innerHTML = rooms.map(r =>
        `<div class="room ${currentRoom===r.id?'active':''}" onclick="openRoom(${r.id}, '${r.name.replace(/'/g, '')}')">
          ${r.name} ${r.unread_count ? `<span class="unread">${r.unread_count}</span>` : ""}
          <div class="hint">${r.last_message ? r.last_message.sender_username + ': ' + r.last_message.content : '暂无消息'}</div>
        </div>`
      ).join("");
    }

    async function openRoom(id, name) {
      currentRoom = id;
      document.getElementById("title").textContent = name;
      document.getElementById("log").innerHTML = "";
      const msgs = await api(`/rooms/${id}/messages?limit=50`);
      msgs.forEach(m => log(m.content, m.sender_username));
      socket && socket.send(JSON.stringify({ type: "join", room_id: id }));
      await api(`/rooms/${id}/read`, { method: "POST" });
      await refreshRooms();
    }

    async function createGroup() {
      await api("/rooms", { method: "POST", body: JSON.stringify({ name: group.value }) });
      await refreshRooms();
    }

    async function openDirect() {
      const room = await api("/rooms/direct", { method: "POST", body: JSON.stringify({ username: peer.value }) });
      await refreshRooms();
      openRoom(room.id, room.name);
    }

    function send() {
      const content = text.value.trim();
      if (!content || !currentRoom || !socket) return;
      socket.send(JSON.stringify({ type: "send", room_id: currentRoom, content }));
      text.value = "";
    }
  </script>
</body>
</html>
